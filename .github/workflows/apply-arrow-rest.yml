name: Apply Zephyr arrow long-rest recharge
on:
  push:
    paths:
      - '.github/workflows/apply-arrow-rest.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: node scripts/patch-arrow-rest.js
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          m=re.search(r'<script>([\s\S]*)</script>',s)
          open('/tmp/zephyr.js','w',encoding='utf-8').write(m.group(1))
          PY
          node --check /tmp/zephyr.js
      - name: Commit companion and clean helper files
        run: |
          git config user.name "bryantoualy-del"
          git config user.email "bryantoualy@gmail.com"
          git rm scripts/patch-arrow-rest.js .github/workflows/apply-arrow-rest.yml
          git add index.html
          git commit -m "Recharge Silver Flame arrows on long rest"
          git push
