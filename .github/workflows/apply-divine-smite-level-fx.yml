name: Apply Zephyr Divine Smite level FX
on:
  push:
    paths:
      - '.github/workflows/apply-divine-smite-level-fx.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python .github/scripts/patch_divine_smite_levels.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/zephyr.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/zephyr.js
      - name: Commit patched companion and clean helper files
        run: |
          rm .github/scripts/patch_divine_smite_levels.py
          rm .github/workflows/apply-divine-smite-level-fx.yml
          git config user.name "bryantoualy-del"
          git config user.email "bryantoualy@gmail.com"
          git add index.html .github/scripts/patch_divine_smite_levels.py .github/workflows/apply-divine-smite-level-fx.yml
          git commit -m "Graduate Divine Smite holy FX by spell-slot level"
          git push
