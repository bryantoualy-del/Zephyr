name: Apply Zephyr hit confirmation
on:
  push:
    paths:
      - '.github/scripts/add-hit-confirmation.js'
      - '.github/workflows/apply-hit-confirmation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: node .github/scripts/add-hit-confirmation.js
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          open('/tmp/zephyr.js','w',encoding='utf-8').write(m.group(1))
          PY
          node --check /tmp/zephyr.js
      - name: Commit companion and clean helper files
        run: |
          git config user.name "bryantoualy-del"
          git config user.email "bryantoualy@gmail.com"
          git add index.html
          git rm -f .github/scripts/add-hit-confirmation.js .github/workflows/apply-hit-confirmation.yml
          git commit -m "Ask user to confirm whether each attack hits"
          git push
