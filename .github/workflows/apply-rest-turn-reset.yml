name: Apply Zephyr rest turn reset
on:
  push:
    paths:
      - '.github/workflows/apply-rest-turn-reset.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="function shortRest(){S.channel=1;S.guidedReady=false;addLog('Repos court','Conduit divin récupéré.','rest')}function longRest(){S.hp=84;S.maxHp=84;S.tempHp=0;S.slots={1:4,2:3,3:2};S.lay=50;S.sense=5;S.channel=1;S.decree=1;S.anchor=1;S.arrows=3;S.mark=false;S.conc='';S.spellSmite=null;S.lastHit=null;S.attackCount=0;S.guidedReady=false;S.eco={a:false,b:false,r:false,m:false};addLog('Repos long','PV, slots, flèches et ressources restaurés • Marque dissipée après prière.','rest')}"
          new="function resetTurnAfterRest(){S.turn=1;S.dmg=0;S.attackCount=0;S.lastHit=null;S.eco={a:false,b:false,r:false,m:false};S.guidedReady=false}function shortRest(){S.channel=1;resetTurnAfterRest();addLog('Repos court','Conduit divin récupéré • compteur de tours et économie d’action réinitialisés.','rest')}function longRest(){S.hp=84;S.maxHp=84;S.tempHp=0;S.slots={1:4,2:3,3:2};S.lay=50;S.sense=5;S.channel=1;S.decree=1;S.anchor=1;S.arrows=3;S.mark=false;S.conc='';S.spellSmite=null;resetTurnAfterRest();addLog('Repos long','PV, slots, flèches et ressources restaurés • tours réinitialisés • Marque dissipée après prière.','rest')}"
          if old not in s:
              raise SystemExit('Target rest functions not found')
          p.write_text(s.replace(old,new,1))
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          import re
          s=open('index.html').read()
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          open('/tmp/zephyr.js','w').write(m.group(1))
          PY
          node --check /tmp/zephyr.js
      - name: Commit companion and clean helper
        run: |
          git config user.name "bryantoualy-del"
          git config user.email "bryantoualy@gmail.com"
          rm .github/workflows/apply-rest-turn-reset.yml
          git add index.html .github/workflows/apply-rest-turn-reset.yml
          git commit -m "Reset turn state on short and long rests"
          git push