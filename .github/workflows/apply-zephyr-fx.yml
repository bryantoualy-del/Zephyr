name: Apply Zephyr FX patch

on:
  push:
    paths:
      - '.github/workflows/apply-zephyr-fx.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/zephyr_fx_patch.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/zephyr.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/zephyr.js
      - name: Commit patched companion and clean helper files
        run: |
          rm .github/zephyr_fx_patch.py .github/workflows/apply-zephyr-fx.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add combat ribbons, undo and spell/smite FX"
          git push
