name: Apply Zephyr combat FX
on:
  push:
    paths:
      - '.github/patch-zephyr-combat-fx.py'
      - '.github/workflows/apply-zephyr-combat-fx.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/patch-zephyr-combat-fx.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          if not m: raise SystemExit('script block missing')
          Path('/tmp/zephyr.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/zephyr.js
      - name: Commit combat FX
        run: |
          git config user.name "bryantoualy-del"
          git config user.email "bryantoualy@gmail.com"
          git add index.html
          git rm .github/patch-zephyr-combat-fx.py .github/workflows/apply-zephyr-combat-fx.yml
          git commit -m "Add holy smite, punch impact and Silver Flame arrow FX"
          git push
