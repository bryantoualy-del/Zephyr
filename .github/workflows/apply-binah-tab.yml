name: Apply Zephyr BINAH tab
on:
  push:
    paths:
      - .github/binah-tab-trigger.txt
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch index
        run: python3 scripts/binah_patch.py
      - name: Validate JavaScript
        run: |
          python3 -c "import re,pathlib; s=pathlib.Path('index.html').read_text(); m=re.search(r'<script>(.*?)</script>',s,re.S); assert m; pathlib.Path('/tmp/zephyr.js').write_text(m.group(1))"
          node --check /tmp/zephyr.js
      - name: Commit
        run: |
          git config user.name bryantoualy-del
          git config user.email bryantoualy@gmail.com
          git add index.html
          git commit -m "Add dedicated BINAH vestige tab and move auras to Powers"
          git push
